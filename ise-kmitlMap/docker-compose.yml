# ────────────────────────────────────────────────────────────────
# SciMap — แยกเป็น 3 คอนเทนเนอร์: db / backend / frontend
#
# เริ่มใช้งาน:
#   cp .env.example .env      แล้วแก้ POSTGRES_PASSWORD
#   docker compose up -d --build
#
# เปิดใช้งานที่ http://<EXTERNAL_IP>
# ────────────────────────────────────────────────────────────────

services:
  # ── ฐานข้อมูล PostgreSQL ──────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: scimap-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kmitlmap}
      POSTGRES_USER: ${POSTGRES_USER:-kmitlmap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ต้องกำหนด POSTGRES_PASSWORD ในไฟล์ .env}
      # ให้ collation ภาษาไทยเรียงถูก
      LANG: C.UTF-8
    volumes:
      - db_data:/var/lib/postgresql/data
      # ไฟล์ใน initdb.d จะรันอัตโนมัติ "ครั้งแรกที่สร้าง volume เท่านั้น"
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    networks: [scimap]
    # ไม่ publish port ออกนอกเครื่อง — เข้าถึงได้จาก backend ในเครือข่ายภายในเท่านั้น
    expose: ["5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kmitlmap} -d ${POSTGRES_DB:-kmitlmap}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Backend API (Express) ─────────────────────────────────────
  backend:
    build:
      context: ./backend
    container_name: scimap-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-kmitlmap}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kmitlmap}
    depends_on:
      db:
        condition: service_healthy
    networks: [scimap]
    expose: ["4000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Frontend (Next.js) ────────────────────────────────────────
  frontend:
    build:
      context: .
    container_name: scimap-frontend
    restart: unless-stopped
    environment:
      # ใช้ตอน rewrite /api/* — ชื่อ service ใน network เดียวกัน
      BACKEND_URL: http://backend:4000
      PORT: 3000
    depends_on:
      backend:
        condition: service_healthy
    networks: [scimap]
    # เปิดพอร์ต 80 ออกอินเทอร์เน็ต — เป็นทางเข้าเดียวของระบบ
    ports:
      - "80:3000"

volumes:
  db_data:

networks:
  scimap:
    driver: bridge
